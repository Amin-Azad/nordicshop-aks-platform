apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: postgres
  namespace: nordicshop

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          imagePullPolicy: IfNotPresent

          env:
            - name: POSTGRES_DB
              value: nordicshop

            - name: POSTGRES_USER
              value: nordicshop

            - name: POSTGRES_PASSWORD
              value: nordicshop-dev

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql

          ports:
            - containerPort: 5432

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc