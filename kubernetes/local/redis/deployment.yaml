apiVersion: apps/v1

kind: Deployment

metadata:
  name: redis
  namespace: nordicshop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: redis:8.10.1-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 6379