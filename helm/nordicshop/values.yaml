azure:
  tenantId: ""
  keyVaultName: ""
  nordicApiClientId: ""
  dbAdminClientId: ""

config:
  redisUrl: redis://redis:6379/0

networkPolicy:
  enabled: false
  
redis:
  image: redis:8.10.1-alpine
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  image: postgres:18.6-alpine
  replicas: 1
  database: nordicshop
  user: nordicshop
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


api:
  image: nordicshop-api:prod
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

customerWeb:
  image: nordicshop-customer-web:prod
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

vendorPortal:
  image: nordicshop-vendor-portal:prod
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

adminportal:
  image: nordicshop-admin-portal:prod
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
