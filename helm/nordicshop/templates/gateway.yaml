apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nordicshop-gateway
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: approuting-istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
          