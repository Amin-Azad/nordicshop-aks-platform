apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordicshop-vendor-portal
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.vendorPortal.replicas }}
  selector:
    matchLabels:
      app: nordicshop-vendor-portal
  template:
    metadata:
      labels:
        app: nordicshop-vendor-portal
    spec:
      containers:
        - name: nordicshop-vendor-portal
          image: {{ .Values.vendorPortal.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080