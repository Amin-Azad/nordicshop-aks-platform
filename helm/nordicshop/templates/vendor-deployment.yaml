apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordicshop-vendor-portal
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.vendorPortal.replicas }}
  selector:
    matchLabels:
      app: nordicshop-vendor-portal
  template:
    metadata:
      labels:
        app: nordicshop-vendor-portal
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nordicshop-vendor-portal
          image: {{ .Values.vendorPortal.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            {{ toYaml .Values.vendorPortal.resources | nindent 12 }}

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20