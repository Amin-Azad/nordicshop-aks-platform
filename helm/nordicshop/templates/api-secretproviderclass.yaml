apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: nordicshop-api-keyvault
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

spec:
  provider: azure

  secretObjects:
    - secretName: nordicshop-api-runtime-secret
      type: Opaque
      data:
        - objectName: nordicshop-app-database-url
          key: NORDICSHOP_APP_DATABASE_URL

  parameters:
    usePodIdentity: "false"

    clientID: {{ .Values.azure.nordicApiClientId | quote }}

    keyvaultName: {{ .Values.azure.keyVaultName | quote }}

    tenantId: {{ .Values.azure.tenantId | quote }}

    objects: |
      array:
        - |
          objectName: nordicshop-app-database-url
          objectType: secret
          objectVersion: ""
