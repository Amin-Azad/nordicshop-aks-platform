apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: nordicshop-db-keyvault
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

spec:
  provider: azure

  secretObjects:
    - secretName: nordicshop-db-runtime-secret
      type: Opaque
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
        - objectName: postgres-app-password
          key: POSTGRES_APP_PASSWORD

  parameters:
    usePodIdentity: "false"

    clientID: {{ .Values.azure.dbAdminClientId | quote }}

    keyvaultName: {{ .Values.azure.keyVaultName | quote }}

    tenantId: {{ .Values.azure.tenantId | quote }}

    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
          objectVersion: ""
        - |
          objectName: postgres-app-password
          objectType: secret
          objectVersion: ""
