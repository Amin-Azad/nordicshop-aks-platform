apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordicshop-admin-portal
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.adminportal.replicas }}
  selector:
    matchLabels:
      app: nordicshop-admin-portal
  template:
    metadata:
      labels:
        app: nordicshop-admin-portal
    spec:
      containers:
        - name: nordicshop-admin-portal
          image: {{ .Values.adminportal.image }}
          imagePullPolicy: IfNotPresent

          resources:
            {{ toYaml .Values.adminportal.resources | nindent 12 }}

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20