apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: nordicshop-ingress
  namespace: {{ .Release.Namespace }}

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-web
                port:
                  number: 8080