apiVersion: v1
kind: Namespace
metadata:
  name: nordicshop-rls-lab
  labels:
    app.kubernetes.io/name: nordicshop-rls-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres-rls-lab
  namespace: nordicshop-rls-lab
  labels:
    app: postgres-rls-lab
spec:
  restartPolicy: Never
  containers:
    - name: postgres
      image: postgres:18.6-alpine
      env:
        - name: POSTGRES_DB
          value: nordicshop_rls_lab
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: nordicshop-rls-lab-only
      ports:
        - containerPort: 5432
      readinessProbe:
        exec:
          command:
            - sh
            - -c
            - pg_isready -U postgres -d nordicshop_rls_lab
        initialDelaySeconds: 2
        periodSeconds: 2
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql
  volumes:
    - name: pgdata
      emptyDir: {}
