name: CI Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-validation:
    name: Test and build application
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r application/services/nordic-api/requirements.txt

      - name: Run API tests
        run: python -m pytest -q application/tests

      - name: Build Nordic API image
        run: |
          docker build \
            -t nordicshop-api:ci-test \
            application/services/nordic-api

      - name: Build customer web image
        run: |
          docker build \
            -f application/apps/customer-web/Dockerfile \
            -t nordicshop-customer-web:ci-test \
            application

      - name: Build vendor portal image
        run: |
          docker build \
            -f application/apps/vendor-portal/Dockerfile \
            -t nordicshop-vendor-portal:ci-test \
            application

      - name: Build admin portal image
        run: |
          docker build \
            -f application/apps/admin-portal/Dockerfile \
            -t nordicshop-admin-portal:ci-test \
            application
  platform-validation:
    name: Validate Helm and Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: |
          helm lint helm/nordicshop \
            -f helm/nordicshop/values-dev.yaml

      - name: Render Helm templates
        run: |
          helm template nordicshop helm/nordicshop \
            --namespace nordicshop \
            -f helm/nordicshop/values-dev.yaml \
            > /tmp/nordicshop-rendered.yaml
            
          helm template nordicshop helm/nordicshop \
            --namespace nordicshop \
            -f helm/nordicshop/values-dev.yaml \
            --show-only templates/admin-deployment.yaml \
            --show-only templates/customer-deployment.yaml \
            --show-only templates/vendor-deployment.yaml \
            > /tmp/nordicshop-frontends.yaml

          helm template nordicshop helm/nordicshop \
            --namespace nordicshop \
            -f helm/nordicshop/values-dev.yaml \
            --show-only templates/api-deployment.yaml \
            > /tmp/nordicshop-api.yaml
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize Terraform without backend
        working-directory: infra/environments/dev
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: infra/environments/dev
        run: terraform validate

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            $(find infra -type f -name '*.tf' \
              ! -path 'infra/modules/prometheus-alerts/main.tf' \
              -printf ' -f %p') \
            --framework terraform \
            --skip-check CKV_AZURE_237,CKV_AZURE_167,CKV_AZURE_166,CKV_AZURE_163,CKV_AZURE_233,CKV_AZURE_164,CKV_AZURE_139,CKV_AZURE_165,CKV_AZURE_227,CKV_AZURE_6,CKV_AZURE_117,CKV_AZURE_116,CKV_AZURE_115,CKV_AZURE_170,CKV_AZURE_226,CKV_AZURE_141,CKV_AZURE_171,CKV_AZURE_168,CKV_AZURE_232,CKV_AZURE_7,CKV_AZURE_109,CKV_AZURE_189,CKV2_AZURE_32,CKV2_AZURE_31
          
          checkov \
            -f /tmp/nordicshop-frontends.yaml \
            --framework kubernetes \
            --check CKV_K8S_8,CKV_K8S_10,CKV_K8S_11,CKV_K8S_12,CKV_K8S_13,CKV_K8S_16,CKV_K8S_20,CKV_K8S_25,CKV_K8S_28,CKV_K8S_31,CKV_K8S_43

          checkov \
            -f /tmp/nordicshop-api.yaml \
            --framework kubernetes \
            --check CKV_K8S_8,CKV_K8S_16,CKV_K8S_25,CKV_K8S_31