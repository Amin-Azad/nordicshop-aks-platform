name: Publish Images to ACR

on:
  push:
    branches:
      - main
    paths:
      - "application/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  AZURE_CLIENT_ID: 78dfb27f-8d9c-4b25-9343-7ea5a8822bc8
  AZURE_TENANT_ID: ce02f814-9bb0-4eeb-a5e6-42af533c9e9f
  AZURE_SUBSCRIPTION_ID: d3da25e5-680e-459c-99cf-0c4be70f4aad

  ACR_NAME: acrnordicshopazaddevweu
  ACR_LOGIN_SERVER: acrnordicshopazaddevweu.azurecr.io

jobs:
  publish-images:
    name: Build and publish NordicShop images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Nordic API image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/nordicshop-api:$GITHUB_SHA" \
            application/services/nordic-api

      - name: Build customer web image
        run: |
          docker build \
            -f application/apps/customer-web/Dockerfile \
            -t "$ACR_LOGIN_SERVER/nordicshop-customer-web:$GITHUB_SHA" \
            application

      - name: Build vendor portal image
        run: |
          docker build \
            -f application/apps/vendor-portal/Dockerfile \
            -t "$ACR_LOGIN_SERVER/nordicshop-vendor-portal:$GITHUB_SHA" \
            application

      - name: Build admin portal image
        run: |
          docker build \
            -f application/apps/admin-portal/Dockerfile \
            -t "$ACR_LOGIN_SERVER/nordicshop-admin-portal:$GITHUB_SHA" \
            application

      - name: Scan Nordic API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ACR_LOGIN_SERVER }}/nordicshop-api:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Scan customer web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ACR_LOGIN_SERVER }}/nordicshop-customer-web:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Scan vendor portal image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ACR_LOGIN_SERVER }}/nordicshop-vendor-portal:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Scan admin portal image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.ACR_LOGIN_SERVER }}/nordicshop-admin-portal:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Push images to ACR
        run: |
          docker push "$ACR_LOGIN_SERVER/nordicshop-api:$GITHUB_SHA"
          docker push "$ACR_LOGIN_SERVER/nordicshop-customer-web:$GITHUB_SHA"
          docker push "$ACR_LOGIN_SERVER/nordicshop-vendor-portal:$GITHUB_SHA"
          docker push "$ACR_LOGIN_SERVER/nordicshop-admin-portal:$GITHUB_SHA"

      - name: Capture immutable image digests
        run: |
          API_DIGEST=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "nordicshop-api:$GITHUB_SHA" \
            --query digest \
            -o tsv)

          CUSTOMER_DIGEST=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "nordicshop-customer-web:$GITHUB_SHA" \
            --query digest \
            -o tsv)

          VENDOR_DIGEST=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "nordicshop-vendor-portal:$GITHUB_SHA" \
            --query digest \
            -o tsv)

          ADMIN_DIGEST=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "nordicshop-admin-portal:$GITHUB_SHA" \
            --query digest \
            -o tsv)

          echo "API_DIGEST=$API_DIGEST" >> "$GITHUB_ENV"
          echo "CUSTOMER_DIGEST=$CUSTOMER_DIGEST" >> "$GITHUB_ENV"
          echo "VENDOR_DIGEST=$VENDOR_DIGEST" >> "$GITHUB_ENV"
          echo "ADMIN_DIGEST=$ADMIN_DIGEST" >> "$GITHUB_ENV"

          {
            echo "Git commit: $GITHUB_SHA"
            echo
            echo "$ACR_LOGIN_SERVER/nordicshop-api@$API_DIGEST"
            echo "$ACR_LOGIN_SERVER/nordicshop-customer-web@$CUSTOMER_DIGEST"
            echo "$ACR_LOGIN_SERVER/nordicshop-vendor-portal@$VENDOR_DIGEST"
            echo "$ACR_LOGIN_SERVER/nordicshop-admin-portal@$ADMIN_DIGEST"
          } | tee image-digests.txt
      - name: Add image digests to workflow summary
        run: |
          {
            echo "## Published NordicShop Images"
            echo
            echo '```text'
            cat image-digests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: nordicshop-image-digests-${{ github.sha }}
          path: image-digests.txt
          retention-days: 30

      - name: Update Helm values with immutable digests
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("helm/nordicshop/values-dev.yaml")
          text = path.read_text()

          replacements = {
              "nordicshop-api": os.environ["API_DIGEST"],
              "nordicshop-customer-web": os.environ["CUSTOMER_DIGEST"],
              "nordicshop-vendor-portal": os.environ["VENDOR_DIGEST"],
              "nordicshop-admin-portal": os.environ["ADMIN_DIGEST"],
          }

          login_server = os.environ["ACR_LOGIN_SERVER"]

          for image, digest in replacements.items():
              pattern = rf"{re.escape(login_server)}/{re.escape(image)}@sha256:[0-9a-f]+"
              replacement = f"{login_server}/{image}@{digest}"

              text, count = re.subn(pattern, replacement, text)

              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one existing digest reference for {image}, found {count}"
                  )

          path.write_text(text)
          PY

      - name: Show proposed Helm digest changes
        run: git diff -- helm/nordicshop/values-dev.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Validate updated Helm values
        run: |
          helm lint helm/nordicshop \
            -f helm/nordicshop/values-dev.yaml

          helm template nordicshop helm/nordicshop \
            --namespace nordicshop \
            -f helm/nordicshop/values-dev.yaml \
            > /tmp/nordicshop-rendered.yaml

      - name: Check whether digest values changed
        id: digest_changes
        run: |
          if git diff --quiet -- helm/nordicshop/values-dev.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Helm digest update is required."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New Helm digests will be proposed through a pull request."
          fi

      - name: Create digest update branch and commit
        if: steps.digest_changes.outputs.changed == 'true'
        id: digest_commit
        run: |
          BRANCH="automation/image-digests-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"

          git add helm/nordicshop/values-dev.yaml

          git commit \
            -m "chore: update NordicShop image digests"

          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create digest update pull request
        if: steps.digest_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.digest_commit.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update NordicShop image digests" \
            --body "## NordicShop image digest update

          This pull request was generated by the image publication workflow.

          Source commit:
          \`${GITHUB_SHA}\`

          The four custom NordicShop images were built and pushed to ACR, their immutable digests were resolved, and \`helm/nordicshop/values-dev.yaml\` was updated.

          Validation performed before opening this PR:

          - immutable ACR digests resolved
          - Helm lint passed
          - Helm template render passed

          Deployment remains review-controlled:

          merge PR → Argo CD detects Git change → AKS reconciles."


