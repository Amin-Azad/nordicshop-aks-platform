apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nordicshop
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Amin-Azad/nordicshop-aks-platform.git
    targetRevision: main
    path: helm/nordicshop

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: nordicshop

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
